<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown → PDF（打印版）</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --text:#1c1f23; --muted:#6b7280;
    --accent:#1f6feb; --accent-soft:#e8f0fe; --ok:#15803d; --warn:#b45309; --err:#b91c1c;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",system-ui,sans-serif;
    font-size:14px;display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .badge{font-size:12px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:20px}
  header .spacer{flex:1}
  header .hint{font-size:12px;color:var(--muted)}
  header .dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;display:inline-block;margin-right:5px}
  header .dot.ok{background:var(--ok)}
  header .dot.err{background:var(--err)}

  main{flex:1;display:flex;min-height:0;gap:0}
  .editor{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 0 14px 18px}
  .bar{display:flex;align-items:center;gap:10px;padding:0 0 10px;}
  .bar .name{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
  .bar .spacer{flex:1}
  textarea{
    flex:1;width:100%;resize:none;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;font-family:"Cascadia Mono",Consolas,"Microsoft YaHei",monospace;
    font-size:13.5px;line-height:1.75;color:var(--text);background:var(--panel);outline:none;
    tab-size:2;
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea.drop{border-color:var(--accent);background:var(--accent-soft)}

  aside{
    width:310px;flex:0 0 310px;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:16px 18px 24px;
  }
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-weight:600}
  aside h2:first-child{margin-top:0}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
  .field label{font-size:13px;color:var(--text);flex:1}
  .field select,.field input[type=number],.field input[type=text]{
    width:150px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;
    background:#fff;color:var(--text);font-family:inherit;outline:none;
  }
  .field select:focus,.field input:focus{border-color:var(--accent)}
  .field input[type=range]{width:150px}
  .field .val{font-size:12px;color:var(--muted);width:34px;text-align:right}
  .check{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px;cursor:pointer}
  .check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row2 .field{flex-direction:column;align-items:stretch;gap:4px;margin:0}
  .row2 .field select,.row2 .field input{width:100%}
  .row2 .field label{font-size:12px;color:var(--muted)}

  footer{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;
    background:var(--panel);border-top:1px solid var(--line);
  }
  button{
    font-family:inherit;font-size:13.5px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--text);cursor:pointer;transition:.15s;
  }
  button:hover:not(:disabled){border-color:#c8ccd2;background:#fafbfc}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.primary:hover:not(:disabled){background:#1a5fd0;border-color:#1a5fd0}
  button.ghost{border-color:transparent;color:var(--muted);padding:8px 10px}
  button.ghost:hover{background:var(--bg)}
  .status{flex:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status.err{color:var(--err)}
  .status.ok{color:var(--ok)}

  .overlay{
    position:fixed;inset:0;background:rgba(20,23,28,.55);display:none;flex-direction:column;
    z-index:50;padding:24px;
  }
  .overlay.on{display:flex}
  .overlay .tree{width:min(880px,100%);height:100%;margin:0 auto;background:#fff;border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .overlay .ohead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .overlay .ohead b{font-size:13px;font-weight:600}
  .overlay .ohead .spacer{flex:1}
  .overlay iframe{flex:1;border:0;width:100%;background:#fff}
  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
  kbd{font-family:inherit;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<header>
  <h1>Markdown → PDF</h1>
  <span class="badge" id="ver">v0.1.0</span>
  <span class="spacer"></span>
  <span class="hint" id="env"><span class="dot"></span>检测中…</span>
</header>

<main>
  <section class="editor">
    <div class="bar">
      <span class="name" id="fname">未命名文档</span>
      <span class="spacer"></span>
      <button class="ghost" id="btnSample">载入示例</button>
      <button class="ghost" id="btnClear">清空</button>
    </div>
    <textarea id="md" spellcheck="false" placeholder="把 .md 文件拖进来，或直接在这里粘贴 Markdown……"></textarea>
  </section>

  <aside>
    <h2>版式</h2>
    <div class="row2">
      <div class="field"><label>主题</label>
        <select id="theme">
          <option value="print" selected>黑白省墨</option>
          <option value="default">彩色印刷</option>
        </select>
      </div>
      <div class="field"><label>纸张</label>
        <select id="paper">
          <option value="A4" selected>A4</option>
          <option value="A5">A5</option>
          <option value="B5">B5</option>
          <option value="B4">B4</option>
          <option value="Letter">Letter</option>
        </select>
      </div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div class="field"><label>页边距</label>
        <select id="margin">
          <option value="normal" selected>标准</option>
          <option value="narrow">窄</option>
          <option value="wide">宽</option>
          <option value="book">装订（左宽）</option>
        </select>
      </div>
      <div class="field"><label>方向</label>
        <select id="landscape">
          <option value="0" selected>纵向</option>
          <option value="1">横向</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:8px"><label>表格线</label>
      <select id="tableLines">
        <option value="grid" selected>完整网格</option>
        <option value="rules">只有横线</option>
      </select>
    </div>

    <h2>文字</h2>
    <div class="field"><label>字号</label><input type="range" id="fontSize" min="8" max="16" step="0.5" value="10.5"><span class="val" id="fontSizeVal">10.5</span></div>
    <div class="field"><label>行高</label><input type="range" id="lineHeight" min="1.2" max="2.4" step="0.05" value="1.7"><span class="val" id="lineHeightVal">1.7</span></div>
    <div class="field"><label>首行缩进</label>
      <select id="textIndent">
        <option value="0" selected>不缩进</option>
        <option value="2">缩进 2 字</option>
      </select>
    </div>
    <div class="field"><label>对齐</label>
      <select id="textAlign">
        <option value="left" selected>左对齐</option>
        <option value="justify">两端对齐</option>
      </select>
    </div>

    <h2>打印</h2>
    <label class="check"><input type="checkbox" id="pageNumbers" checked>显示页码</label>
    <label class="check"><input type="checkbox" id="toc">生成目录（单独一页）</label>
    <label class="check"><input type="checkbox" id="pageBreakOnH1">每个一级标题另起一页</label>
    <div class="field" style="margin-top:10px"><label>页眉</label><input type="text" id="headerText" placeholder="默认用文档标题"></div>
    <div class="field"><label>页脚</label><input type="text" id="footerText" placeholder="留空则不显示"></div>

    <h2>内容</h2>
    <label class="check"><input type="checkbox" id="highlight" checked>代码高亮（黑白打印会转灰阶）</label>
    <label class="check"><input type="checkbox" id="mermaid" checked>渲染 Mermaid 图表</label>

    <p class="note">预览为网页模式，实际分页以下载的 PDF 为准。</p>
    <p class="note" id="srvInfo" style="color:#9aa4b0;font-size:11px"></p>
  </aside>
</main>

<footer>
  <button id="btnPreview">预览</button>
  <button id="btnPdf" class="primary">生成 PDF</button>
  <span class="status" id="status">就绪</span>
  <kbd>Ctrl</kbd>+<kbd>Enter</kbd>
</footer>

<div class="overlay" id="overlay">
  <div class="tree">
    <div class="ohead"><b>预览</b><span class="spacer"></span><button id="btnClosePreview">关闭</button></div>
    <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const els = {
  md: $('md'), fname: $('fname'), status: $('status'), env: $('env'), ver: $('ver'),
  theme: $('theme'), paper: $('paper'), margin: $('margin'), landscape: $('landscape'), tableLines: $('tableLines'),
  fontSize: $('fontSize'), fontSizeVal: $('fontSizeVal'),
  lineHeight: $('lineHeight'), lineHeightVal: $('lineHeightVal'),
  textIndent: $('textIndent'), textAlign: $('textAlign'),
  pageNumbers: $('pageNumbers'), toc: $('toc'), pageBreakOnH1: $('pageBreakOnH1'),
  headerText: $('headerText'), footerText: $('footerText'),
  highlight: $('highlight'), mermaid: $('mermaid'),
  btnPreview: $('btnPreview'), btnPdf: $('btnPdf'), btnClear: $('btnClear'), btnSample: $('btnSample'),
  overlay: $('overlay'), previewFrame: $('previewFrame'), btnClosePreview: $('btnClosePreview'),
  srvInfo: $('srvInfo'),
};
let currentFile = null;
let currentBaseDir = null;

const SAMPLE = `---
title: 示例文档
author: 大肥鱼
---

# 一、格式演示

这一段演示 **加粗**、*斜体*、<u>下划线</u>、~~删除线~~、\`行内代码\` 和 [链接](https://example.com)。

## 1.1 代码块

\`\`\`js
const greet = (name) => \`你好，\${name}\`;
console.log(greet('世界'));
\`\`\`

## 1.2 表格

| 项目 | 状态 | 说明 |
| --- | --- | --- |
| 加粗斜体 | 完成 | 真字体 |
| 代码高亮 | 完成 | 黑白自动转灰 |

## 1.3 公式与图表

行内 $E = mc^2$，块级：

$$
\\frac{\\pi^4}{15}
$$

\`\`\`mermaid
graph LR
  A[Markdown] --> B[HTML] --> C[PDF]
\`\`\`
`;

function setStatus(text, kind = '') {
  els.status.textContent = text;
  els.status.className = 'status' + (kind ? ' ' + kind : '');
}

function collectOptions() {
  return {
    theme: els.theme.value,
    paper: els.paper.value,
    landscape: els.landscape.value === '1',
    tableLines: els.tableLines.value,
    margin: els.margin.value,
    fontSize: parseFloat(els.fontSize.value),
    lineHeight: parseFloat(els.lineHeight.value),
    textIndent: parseFloat(els.textIndent.value),
    textAlign: els.textAlign.value,
    pageNumbers: els.pageNumbers.checked,
    toc: els.toc.checked,
    pageBreakOnH1: els.pageBreakOnH1.checked,
    headerText: els.headerText.value.trim(),
    footerText: els.footerText.value.trim(),
    highlight: els.highlight.checked,
    mermaid: els.mermaid.checked,
  };
}

function saveState() {
  try {
    localStorage.setItem('md2pdf:opts', JSON.stringify(collectOptions()));
  } catch {}
}
function loadState() {
  try {
    const raw = localStorage.getItem('md2pdf:opts');
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o.theme) els.theme.value = o.theme;
    if (o.paper) els.paper.value = o.paper;
    if (o.margin) els.margin.value = o.margin;
    els.landscape.value = o.landscape ? '1' : '0';
    if (o.tableLines) els.tableLines.value = o.tableLines;
    if (o.fontSize) els.fontSize.value = o.fontSize;
    if (o.lineHeight) els.lineHeight.value = o.lineHeight;
    if (o.textIndent != null) els.textIndent.value = String(o.textIndent);
    if (o.textAlign) els.textAlign.value = o.textAlign;
    if (o.pageNumbers != null) els.pageNumbers.checked = !!o.pageNumbers;
    if (o.toc != null) els.toc.checked = !!o.toc;
    if (o.pageBreakOnH1 != null) els.pageBreakOnH1.checked = !!o.pageBreakOnH1;
    if (o.headerText) els.headerText.value = o.headerText;
    if (o.footerText) els.footerText.value = o.footerText;
    if (o.highlight != null) els.highlight.checked = !!o.highlight;
    if (o.mermaid != null) els.mermaid.checked = !!o.mermaid;
  } catch {}
}

function syncRanges() {
  els.fontSizeVal.textContent = els.fontSize.value;
  els.lineHeightVal.textContent = els.lineHeight.value;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return res;
}

async function doPreview() {
  if (!els.md.value.trim()) { setStatus('没有内容', 'err'); return; }
  setStatus('正在生成预览…');
  els.btnPreview.disabled = true;
  try {
    const res = await api('/api/preview', {
      markdown: els.md.value,
      options: collectOptions(),
      filename: currentFile,
      baseDir: currentBaseDir,
    });
    const data = await res.json();
    els.previewFrame.srcdoc = data.html;
    els.overlay.classList.add('on');
    setStatus('预览已生成');
  } catch (e) {
    setStatus('预览失败：' + e.message, 'err');
  } finally {
    els.btnPreview.disabled = false;
  }
}

async function doPdf() {
  if (!els.md.value.trim()) { setStatus('没有内容', 'err'); return; }
  setStatus('正在生成 PDF…');
  els.btnPdf.disabled = true;
  const t0 = Date.now();
  try {
    const res = await api('/api/pdf', {
      markdown: els.md.value,
      options: collectOptions(),
      filename: currentFile,
      baseDir: currentBaseDir,
    });
    const blob = await res.blob();
    const name = (currentFile ? currentFile.replace(/\.[^.]+$/, '') : 'document') + '.pdf';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    const cost = ((Date.now() - t0) / 1000).toFixed(1);
    let warnings = [];
    try { warnings = JSON.parse(decodeURIComponent(res.headers.get('X-Warnings') || '[]')); } catch {}
    setStatus(`已生成 ${name}（${(blob.size / 1024).toFixed(0)} KB，${cost}s）` + (warnings.length ? ` ⚠ ${warnings.length} 条提示` : ''), 'ok');
    if (warnings.length) console.warn('转换提示：', warnings);
  } catch (e) {
    setStatus('生成失败：' + e.message, 'err');
  } finally {
    els.btnPdf.disabled = false;
  }
}

async function loadFile(file) {
  if (!/\.(md|markdown|mdown|txt)$/i.test(file.name)) {
    setStatus(`不支持的文件类型：${file.name}`, 'err');
    return;
  }
  const text = await file.text();
  els.md.value = text;
  currentFile = file.name;
  currentBaseDir = file.path ? file.path.replace(/[\\/][^\\/]+$/, '') : null;
  els.fname.textContent = file.name;
  setStatus(`已载入 ${file.name}（${(file.size / 1024).toFixed(1)} KB）`, 'ok');
}

// ---------- 事件 ----------
els.btnPreview.onclick = doPreview;
els.btnPdf.onclick = doPdf;
els.btnClosePreview.onclick = () => els.overlay.classList.remove('on');
els.overlay.onclick = (e) => { if (e.target === els.overlay) els.overlay.classList.remove('on'); };
els.btnClear.onclick = () => {
  els.md.value = '';
  currentFile = null; currentBaseDir = null;
  els.fname.textContent = '未命名文档';
  setStatus('已清空');
};
els.btnSample.onclick = () => {
  els.md.value = SAMPLE;
  currentFile = '示例文档.md'; currentBaseDir = null;
  els.fname.textContent = '示例文档.md';
  setStatus('已载入示例');
};

for (const el of [els.fontSize, els.lineHeight]) {
  el.addEventListener('input', () => { syncRanges(); saveState(); });
}
document.querySelectorAll('aside select, aside input[type=checkbox], aside input[type=text]').forEach((el) => {
  el.addEventListener('change', saveState);
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doPdf(); }
  if (e.key === 'Escape') els.overlay.classList.remove('on');
});

// 拖拽
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
  dragDepth++; els.md.classList.add('drop');
});
window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; els.md.classList.remove('drop'); }
});
window.addEventListener('dragover', (e) => { if (e.dataTransfer) { e.dataTransfer.dropEffect = 'copy'; e.preventDefault(); } });
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragDepth = 0; els.md.classList.remove('drop');
  const files = Array.from(e.dataTransfer.files || []);
  if (files.length) await loadFile(files[0]);
});

// 粘贴 .md 文件
document.addEventListener('paste', (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  for (const it of items) {
    if (it.kind === 'file') {
      const f = it.getAsFile();
      if (f) { e.preventDefault(); loadFile(f); return; }
    }
  }
});

// ---------- 初始化 ----------
syncRanges();
loadState();
syncRanges();
fetch('/api/info').then((r) => r.json()).then((info) => {
  els.ver.textContent = 'v' + info.version;
  const dot = els.env.querySelector('.dot');
  if (info.browser) {
    dot.classList.add('ok');
    els.env.lastChild.textContent = '浏览器已就绪';
    els.env.title = info.browser;
  } else {
    dot.classList.add('err');
    els.env.lastChild.textContent = '未找到 Edge/Chrome';
  }
  if (els.srvInfo && info.startedAt) {
    const t = new Date(info.startedAt);
    els.srvInfo.textContent = `服务启动于 ${t.toLocaleString('zh-CN', { hour12: false })}（改了代码请重启服务）`;
  }
}).catch(() => {
  els.env.lastChild.textContent = '服务未响应';
});
</script>
</body>
</html>
